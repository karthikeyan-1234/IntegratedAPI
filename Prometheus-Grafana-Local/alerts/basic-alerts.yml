groups:
  - name: basic_alerts
    rules:
    - alert: HighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High response time"
        description: "P95 latency is {{ $value }}s (> 500ms)"
        
    - alert: HighErrorRate
      expr: |
        sum(rate(http_requests_received_total{code=~"5.."}[5m])) 
        / 
        sum(rate(http_requests_received_total[5m])) > 0.05
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "High error rate"
        description: "5xx error rate is {{ $value | humanizePercentage }} (> 5%)"
        
    - alert: ServiceDown
      expr: up{job="dotnet-api"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Service is down"
        description: "API has been down for more than 1 minute"