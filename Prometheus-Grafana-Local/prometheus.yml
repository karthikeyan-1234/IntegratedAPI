global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: 'dotnet-api'
    scheme: https
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:7216']
        labels:
          app: 'dotnet-api'
          env: 'development'
    scrape_interval: 15s
    tls_config:
      insecure_skip_verify: true