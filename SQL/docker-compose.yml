name: sqlserver-app

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-container
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer  # Use Developer edition
      - MSSQL_TCP_PORT=1433
    ports:
      - "1433:1433"  # Maps host port 1433 to container port 1433
    volumes:
      - sqlserver-data:/var/opt/mssql  # Persist database data
      - ./scripts:/scripts  # Optional: Mount SQL scripts folder
    networks:
      - sqlserver-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

networks:
  sqlserver-network:
    driver: bridge

volumes:
  sqlserver-data:
    driver: local