# ============================================================================
# Logstash - Complete Configuration (Dev / Docker Desktop)
# ============================================================================

# ----------------------------------------------------------------------------
# ConfigMap: Logstash Pipeline Configuration
# ----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: elk
data:
  logstash.conf: |
    input {
      http {
        port => 5001
        codec => json
        response_headers => {
          "Access-Control-Allow-Origin" => "*"
          "Access-Control-Allow-Methods" => "GET, POST, OPTIONS"
          "Access-Control-Allow-Headers" => "Content-Type"
        }
      }
    }
    
    filter {
      # Add timestamp if not present
      if ![timestamp] {
        mutate {
          add_field => { "timestamp" => "%{@timestamp}" }
        }
      }
      
      # Parse JSON if it's a string
      if [message] =~ /^\{.*\}$/ {
        json {
          source => "message"
        }
      }
    }
    
    output {
      # Console for debugging
      stdout {
        codec => rubydebug
      }
      
      # Elasticsearch output
      elasticsearch {
        hosts => ["http://elasticsearch.elk.svc.cluster.local:9200"]
        index => "logstash-%{+YYYY.MM.dd}"
        
        # Disable template management for simplicity
        manage_template => false
        
        # Document type
        document_type => "_doc"
        
        # Retry settings
        retry_initial_interval => 2
        retry_max_interval => 64
        retry_on_conflict => 3
      }
    }

---

# ----------------------------------------------------------------------------
# Deployment: Logstash
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: elk
  labels:
    app: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.0
          imagePullPolicy: IfNotPresent
          
          ports:
            - containerPort: 5001
              name: http
              protocol: TCP
            - containerPort: 9600
              name: monitoring
              protocol: TCP
          
          env:
            # JVM settings
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            
            # Elasticsearch connection
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch.elk.svc.cluster.local:9200"
            
            # Pipeline settings
            - name: PIPELINE_BATCH_SIZE
              value: "125"
            - name: PIPELINE_BATCH_DELAY
              value: "50"
            
            # Disable monitoring to avoid config file issues
            - name: XPACK_MONITORING_ENABLED
              value: "false"
          
          volumeMounts:
            - name: logstash-pipeline
              mountPath: /usr/share/logstash/pipeline
          
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          
          resources:
            requests:
              cpu: "200m"
              memory: "768Mi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
      
      volumes:
        - name: logstash-pipeline
          configMap:
            name: logstash-pipeline

---

# ----------------------------------------------------------------------------
# Service: Logstash
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: elk
  labels:
    app: logstash
spec:
  selector:
    app: logstash
  ports:
    - name: http
      port: 5001
      targetPort: 5001
      protocol: TCP
    - name: monitoring
      port: 9600
      targetPort: 9600
      protocol: TCP

---

# ----------------------------------------------------------------------------
# Ingress: Logstash
# ----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logstash-ingress
  namespace: elk
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Increase timeout for log ingestion
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Enable CORS for external apps
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  rules:
    - host: logstash.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: logstash
                port:
                  number: 5001