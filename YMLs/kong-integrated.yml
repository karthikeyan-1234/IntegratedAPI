# ------------------------------------------------------------
# Namespace
# ------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: kong
---
# ------------------------------------------------------------
# PostgreSQL PVC
# ------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: kong
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# ------------------------------------------------------------
# PostgreSQL Deployment
# ------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: kong
        - name: POSTGRES_PASSWORD
          value: kong123
        - name: POSTGRES_DB
          value: kong
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
# ------------------------------------------------------------
# PostgreSQL Service
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kong
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
---
# ------------------------------------------------------------
# Kong Migration Job
# ------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-migration-job
  namespace: kong
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-postgres
        image: postgres:15-alpine
        command: ["sh", "-c", "until pg_isready -h postgres -U kong; do sleep 2; done"]
      containers:
      - name: kong-migration
        image: kong:3.8
        command: ["kong", "migrations", "bootstrap"]
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_HOST
          value: postgres
        - name: KONG_PG_USER
          value: kong
        - name: KONG_PG_PASSWORD
          value: kong123
        - name: KONG_PG_DATABASE
          value: kong
---
# ------------------------------------------------------------
# Kong Deployment
# ------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
      - name: kong
        image: kong:3.8
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_HOST
          value: postgres
        - name: KONG_PG_USER
          value: kong
        - name: KONG_PG_PASSWORD
          value: kong123
        - name: KONG_PG_DATABASE
          value: kong

        # Proxy
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000, 0.0.0.0:8443 ssl"

        # Admin
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001"

        # Manager UI
        - name: KONG_ADMIN_GUI_LISTEN
          value: "0.0.0.0:8002"
        - name: KONG_ADMIN_GUI_URL
          value: "https://kong-ui.local"
        - name: KONG_ADMIN_GUI_API_URL
          value: "https://kong-admin.local"

        ports:
        - containerPort: 8000
          hostPort: 80        # <--- binds HTTP to host port 80
        - containerPort: 8443
          hostPort: 443       # <--- binds HTTPS to host port 443
        - containerPort: 8001
          hostPort: 8001
        - containerPort: 8002
          hostPort: 8002
---
# ------------------------------------------------------------
# Kong Proxy Service
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: kong
spec:
  selector:
    app: kong
  ports:
  - name: http
    port: 80
    targetPort: 8000
  - name: https
    port: 443
    targetPort: 8443
---
# ------------------------------------------------------------
# Kong Admin Service
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: kong
spec:
  selector:
    app: kong
  ports:
  - port: 8001
    targetPort: 8001
---
# ------------------------------------------------------------
# Kong Manager Service
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kong-manager
  namespace: kong
spec:
  selector:
    app: kong
  ports:
  - port: 8002
    targetPort: 8002
---
# ------------------------------------------------------------
# Ingress: Kong Proxy (DATA PLANE)
# ------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-proxy-ingress
  namespace: kong
  annotations:
    cert-manager.io/cluster-issuer: local-ca-cluster-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - kong-proxy.local
    secretName: kong-proxy-tls
  rules:
  - host: kong-proxy.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kong-proxy
            port:
              number: 80
---
# ------------------------------------------------------------
# Ingress: Kong Admin API (CONTROL PLANE)
# ------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-admin-ingress
  namespace: kong
  annotations:
    cert-manager.io/cluster-issuer: local-ca-cluster-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - kong-admin.local
    secretName: kong-admin-tls
  rules:
  - host: kong-admin.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kong-admin
            port:
              number: 8001
---
# ------------------------------------------------------------
# Ingress: Kong Manager UI
# ------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-ui-ingress
  namespace: kong
  annotations:
    cert-manager.io/cluster-issuer: local-ca-cluster-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - kong-ui.local
    secretName: kong-ui-tls
  rules:
  - host: kong-ui.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kong-manager
            port:
              number: 8002
