# ------------------------------------------------------------
# Namespace
# ------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: kong
---
# ------------------------------------------------------------
# PostgreSQL PVC
# ------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: kong
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# ------------------------------------------------------------
# PostgreSQL Deployment
# ------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: kong
        - name: POSTGRES_PASSWORD
          value: kong123
        - name: POSTGRES_DB
          value: kong
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
# ------------------------------------------------------------
# PostgreSQL Service
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kong
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
---
# ------------------------------------------------------------
# Kong Migration Job
# ------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-migration-job
  namespace: kong
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-postgres
        image: postgres:15-alpine
        command: ["sh", "-c", "until pg_isready -h postgres -U kong; do sleep 2; done"]
      containers:
      - name: kong-migration
        image: kong:3.8
        command: ["kong", "migrations", "bootstrap"]
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_HOST
          value: postgres
        - name: KONG_PG_USER
          value: kong
        - name: KONG_PG_PASSWORD
          value: kong123
        - name: KONG_PG_DATABASE
          value: kong
---
# ------------------------------------------------------------
# Kong Deployment (HTTP ONLY)
# ------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
      - name: kong
        image: kong:3.8
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_HOST
          value: postgres
        - name: KONG_PG_USER
          value: kong
        - name: KONG_PG_PASSWORD
          value: kong123
        - name: KONG_PG_DATABASE
          value: kong

        # 🔴 HTTP ONLY: Remove SSL from proxy
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000"

        # Admin (unchanged)
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001"

        # Manager UI - Change URLs to HTTP
        - name: KONG_ADMIN_GUI_LISTEN
          value: "0.0.0.0:8002"
        - name: KONG_ADMIN_GUI_URL
          value: "http://kong-ui.local"
        - name: KONG_ADMIN_GUI_API_URL
          value: "http://kong-admin.local"

        ports:
        - containerPort: 8000
          name: http-proxy
        - containerPort: 8001
          name: admin
        - containerPort: 8002
          name: manager
        # Removed: hostPort bindings as they're not needed for HTTP-only
---
# ------------------------------------------------------------
# Kong Proxy Service (HTTP ONLY)
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: kong
spec:
  selector:
    app: kong
  ports:
  - name: http
    port: 80
    targetPort: 8000
  # 🔴 Removed: HTTPS port since we're HTTP-only
---
# ------------------------------------------------------------
# Kong Admin Service (unchanged)
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: kong
spec:
  selector:
    app: kong
  ports:
  - port: 8001
    targetPort: 8001
---
# ------------------------------------------------------------
# Kong Manager Service (unchanged)
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kong-manager
  namespace: kong
spec:
  selector:
    app: kong
  ports:
  - port: 8002
    targetPort: 8002
---
# ------------------------------------------------------------
# Ingress: Kong Proxy (DATA PLANE) - HTTP ONLY
# ------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-proxy-ingress
  namespace: kong
  annotations:
    # 🔴 Removed: cert-manager annotations for HTTP-only
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  # 🔴 Removed: TLS section for HTTP-only
  rules:
  - host: kong-proxy.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kong-proxy
            port:
              number: 80
---
# ------------------------------------------------------------
# Ingress: Kong Admin API (CONTROL PLANE) - HTTP ONLY
# ------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-admin-ingress
  namespace: kong
  annotations:
    # 🔴 Removed: cert-manager annotations for HTTP-only
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  # 🔴 Removed: TLS section for HTTP-only
  rules:
  - host: kong-admin.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kong-admin
            port:
              number: 8001
---
# ------------------------------------------------------------
# Ingress: Kong Manager UI - HTTP ONLY
# ------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-ui-ingress
  namespace: kong
  annotations:
    # 🔴 Removed: cert-manager annotations for HTTP-only
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  # 🔴 Removed: TLS section for HTTP-only
  rules:
  - host: kong-ui.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kong-manager
            port:
              number: 8002