# ============================================================
# kong-integrated-final-v4.yml
# Kong 3.8 + KIC 3.3 + Postgres 15
# Fixes: Admin API Connectivity, CORS, and GUI API URL
# ============================================================

# ------------------------------------------------------------
# 1. Namespace & Full RBAC
# ------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: kong
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kong-serviceaccount
  namespace: kong
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kong-ingress-clusterrole
rules:
  - apiGroups: [""]
    resources: ["endpoints", "nodes", "pods", "secrets", "services", "configmaps", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["configuration.konghq.com"]
    resources:
      - kongplugins
      - kongclusterplugins
      - kongconsumers
      - kongconsumergroups
      - kongingresses
      - kongupstreams
      - kongtargets
      - kongupstreampolicies
      - kongvaults
      - kongcustomentities
      - ingressclassparameters
      - tcpingresses
      - udpingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["configuration.konghq.com"]
    resources: ["tcpingresses/status", "udpingresses/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "grpcroutes", "referencegrants", "gatewayclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kong-ingress-clusterrole-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kong-ingress-clusterrole
subjects:
  - kind: ServiceAccount
    name: kong-serviceaccount
    namespace: kong
---
# ------------------------------------------------------------
# 2. Database (Postgres)
# ------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: kong
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: kong
        - name: POSTGRES_PASSWORD
          value: kong123
        - name: POSTGRES_DB
          value: kong
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kong
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
# ------------------------------------------------------------
# 3. Migration Job
# ------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-migration-job
  namespace: kong
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: kong-migration
        image: kong:3.8
        command: ["kong", "migrations", "bootstrap"]
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_HOST
          value: postgres
        - name: KONG_PG_USER
          value: kong
        - name: KONG_PG_PASSWORD
          value: kong123
        - name: KONG_PG_DATABASE
          value: kong
---
# ------------------------------------------------------------
# 4. Kong Stack (Gateway + Controller Sidecar)
# ------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      serviceAccountName: kong-serviceaccount
      initContainers:
      - name: wait-for-migration
        image: postgres:15-alpine
        command:
          - sh
          - -c
          - |
            until pg_isready -h postgres -U kong -d kong; do echo "Waiting for Postgres..."; sleep 2; done
            until PGPASSWORD=kong123 psql -h postgres -U kong -d kong -c "\dt workspaces" | grep workspaces; do echo "Waiting for Migrations..."; sleep 5; done
      containers:
      - name: kong
        image: kong:3.8
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_HOST
          value: postgres
        - name: KONG_PG_USER
          value: kong
        - name: KONG_PG_PASSWORD
          value: kong123
        - name: KONG_PG_DATABASE
          value: kong
        - name: KONG_PROXY_LISTEN
          value: 0.0.0.0:8000
        # Updated Admin Listen to include SSL and support CORS
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
        - name: KONG_MANAGER_LISTEN
          value: 0.0.0.0:8002
        # Critical Fixes for GUI Connectivity
        - name: KONG_ADMIN_GUI_URL
          value: "http://kong-ui.local"
        - name: KONG_ADMIN_GUI_API_URL
          value: "http://kong-admin.local"
        - name: KONG_ADMIN_CORS
          value: "on"
        - name: KONG_ADMIN_CORS_ORIGINS
          value: "*"
        ports:
        - name: proxy
          containerPort: 8000
        - name: admin
          containerPort: 8001
        - name: manager
          containerPort: 8002
        readinessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
      - name: ingress-controller
        image: kong/kubernetes-ingress-controller:3.3
        env:
        - name: CONTROLLER_KONG_ADMIN_URL
          value: "http://localhost:8001"
        - name: CONTROLLER_INGRESS_CLASS
          value: kong
        - name: CONTROLLER_PUBLISH_SERVICE
          value: "kong/kong-proxy"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
---
# ------------------------------------------------------------
# 5. Services & Ingress
# ------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: kong
spec:
  type: LoadBalancer
  selector:
    app: kong
  ports:
  - name: proxy
    port: 80
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: kong
spec:
  selector:
    app: kong
  ports:
  - name: admin
    port: 8001
    targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: kong-manager
  namespace: kong
spec:
  selector:
    app: kong
  ports:
  - name: manager
    port: 8002
    targetPort: 8002
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: kong
spec:
  controller: konghq.com/ingress-controller
---
# Ingress for the Manager UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-ui-ingress
  namespace: kong
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/preserve-host: "true"
spec:
  ingressClassName: kong
  rules:
  - host: kong-ui.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kong-manager
            port:
              number: 8002
---
# Ingress for the Admin API (Required for the UI to fetch data)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-admin-ingress
  namespace: kong
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/preserve-host: "true"
spec:
  ingressClassName: kong
  rules:
  - host: kong-admin.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kong-admin
            port:
              number: 8001