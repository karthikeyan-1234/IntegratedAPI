input {
  http {
    port => 5001
    codec => json
  }
  
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Add timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Add metadata
  mutate {
    add_field => { 
      "environment" => "development" 
      "source" => "dotnet"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "dotnet-logs-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}